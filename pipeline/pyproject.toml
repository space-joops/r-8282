[project]
name = "kra-predict"
version = "0.1.0"
description = "한국경마 예측 데이터 파이프라인 (data.go.kr KRA API → data/*.json)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "tenacity>=8.3",
    "jsonschema>=4.22",
    "xmltodict>=0.13",
    "python-dotenv>=1.0",
]

[project.scripts]
kra-predict = "kra_predict.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kra_predict"]
